version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: velocira
      POSTGRES_USER: velocira
      POSTGRES_PASSWORD: velocira
    ports:
      - "5432:5432"
    volumes:
      - velocira_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velocira"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/velocira
      DATABASE_USERNAME: velocira
      DATABASE_PASSWORD: velocira
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-min-32-bytes-long}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      # Payment/email/SMS/storage/AI credentials — leave blank locally,
      # set real values in a real environment. See backend/.env.example.
      PAYMENT_KEY_ID: ${PAYMENT_KEY_ID:-}
      PAYMENT_API_KEY: ${PAYMENT_API_KEY:-}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      SMS_API_KEY: ${SMS_API_KEY:-}
    ports:
      - "8080:8080"

volumes:
  velocira_pg_data:
