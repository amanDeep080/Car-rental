name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (typecheck, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx next lint --dir src
      - run: npx next build

  backend:
    name: Backend (compile, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: velocira_test
          POSTGRES_USER: velocira
          POSTGRES_PASSWORD: velocira
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U velocira"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"
      - run: mvn -B clean compile
      - run: mvn -B test
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/velocira_test
          DATABASE_USERNAME: velocira
          DATABASE_PASSWORD: velocira
          JWT_SECRET: ci-test-secret-min-32-bytes-long-value
